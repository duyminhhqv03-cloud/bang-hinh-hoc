# Tự build file APK của Bảng hình học và đăng lên mục Releases.
name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'bang-hinh-hoc.html'
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra khóa ký APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Chưa có secret ANDROID_DEBUG_KEYSTORE. Vào Settings -> Secrets and variables -> Actions -> New repository secret, dán nội dung file keystore-base64.txt, rồi chạy lại."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài Capacitor
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Tạo dự án Android
        working-directory: android-app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node prepare.js www
          npx cap add android
          npx cap sync android
          node prepare.js android

      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/bang-hinh-hoc-1.${{ github.run_number }}.apk"

      - name: Đăng lên Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-1.${{ github.run_number }}
          name: Bảng hình học 1.${{ github.run_number }}
          body: |
            Tải file .apk bên dưới về Galaxy rồi mở để cài.
            Cài đè lên bản cũ được, bài giảng trong app vẫn giữ.
          files: bang-hinh-hoc-1.${{ github.run_number }}.apk
          make_latest: true
